[project]
name = "baselayer"
version = "0.1.38"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "modal>=1.3.0.post1",
    "openai>=1.0.0",
    "pydantic-ai-slim>=1.73.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.9.0",
]
research = [
    "marimo>=0.10.12",
    "pandas>=2.2.1",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
]

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "courses",
    "data",
    "docs",
    ".venv",
    "backend/.venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (FastAPI idiom)
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = [
    "auth",
    "database",
    "models",
    "routers",
    "ai_service",
    "learner_profile",
    "llm",
    "run_limits",
    "spreadsheet_verification",
    "sandbox_exec",
    "course_import",
]

